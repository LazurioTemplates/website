name: Check

# One Linux job runs every gate on every pull request and every push to main
# (Lazurio Module Standard, CI). Windows runs separately, see windows.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: bun run check (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: test "$(bun --version)" = "1.4.4"
      - run: bun install --frozen-lockfile
      # Types (astro check), Biome, the content of data/v2 and the tests: the
      # site model, SEO and accessibility of the build, design tokens and the
      # design system lock, paths that check out on Windows, the template
      # contract, the skills, start and build.
      - run: bun run check
